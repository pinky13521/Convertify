# Nginx konfigurace pro Convertify
# Umístěte např. do /etc/nginx/sites-available/convertify a vytvořte odkaz do /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _; # Nebo vaše doména / IP adresa Lenovo serveru

    root /var/www/convertify; # Cesta, kam nakopírujete soubory projektu
    index index.html;

    # Gzip komprese pro bleskové načítání
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statické soubory knihoven a fontů
    location ~* \.(js|css|woff2|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Zabezpečení
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
