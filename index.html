<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob: https://cdnjs.cloudflare.com; connect-src 'self' data: blob: https://cdnjs.cloudflare.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Convertify - Prémiový Převodník Dokumentů</title>
    <meta name="description"
        content="Profesionální nástroj pro rychlý a bezpečný převod dokumentů. Podporuje formáty PDF, Word, Excel, Obrázky a Markdown.">
    <link rel="stylesheet" href="libs/fonts/outfit.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="app-container">
        <header>
            <div class="header-content">
                <h1>Convertify</h1>
                <button class="btn-history-toggle" id="btn-history-toggle" type="button" title="Historie převodů"
                    aria-label="Historie převodů">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Historie</span>
                    <span class="history-badge hidden" id="history-badge">0</span>
                </button>
            </div>
            <p>Bezpečný převod dokumentů ve vteřině</p>
            <div class="server-status-bar" id="server-status-bar">
                <span class="status-indicator online" id="status-indicator"></span>
                <span class="status-text" id="status-text">Server připojen</span>
            </div>
        </header>

        <section class="upload-section" id="drop-zone">
            <div class="upload-content">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <h2>Přetáhněte soubory sem</h2>
                <p>nebo klikněte pro výběr</p>
                <input type="file" id="file-input" hidden>
                <button class="btn-primary" id="btn-browse">Procházet soubory</button>
            </div>
        </section>

        <section class="conversion-options hidden" id="conversion-options">
            <h3>Vyberte formát pro převod</h3>
            <div class="file-info" id="file-info">
                <!-- Vloženo přes JS -->
            </div>

            <div class="format-grid" id="format-grid">
                <!-- Vloženo přes JS na základě typu souboru -->
            </div>

            <div class="compression-settings hidden" id="compression-settings">
                <label for="quality-slider">Kvalita výsledku: <span id="quality-value">90</span>%</label>
                <input type="range" id="quality-slider" min="10" max="100" value="90" class="slider">
            </div>

            <button class="btn-convert" id="btn-convert">Převést dokument</button>
        </section>

        <section class="progress-section hidden" id="progress-section">
            <h3>Zpracovávám...</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p id="progress-text">0%</p>
        </section>

        <section class="result-section hidden" id="result-section">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>
            <h3>Hotovo!</h3>
            <p>Váš soubor je připraven ke stažení.</p>
            <div id="result-preview" class="result-preview hidden"></div>
            <div id="result-info" class="hidden"></div>
            <button class="btn-download" id="btn-download">Stáhnout převedený soubor</button>
            <button class="btn-secondary" id="btn-restart">Převést další soubor</button>
        </section>

        <section class="error-section hidden" id="error-section">
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h3>Chyba při převodu</h3>
            <p id="error-message">Nastala chyba při zpracování souboru.</p>
            <button class="btn-secondary" id="btn-error-back">Zkusit znovu</button>
        </section>
    </main>

    <!-- Postranní panel historie převodů -->
    <div class="history-drawer-overlay hidden" id="history-drawer-overlay">
        <aside class="history-drawer" id="history-drawer" role="dialog" aria-modal="true" aria-label="Historie převodů">
            <div class="history-drawer-header">
                <div class="history-title-wrap">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <h3>Historie převodů</h3>
                </div>
                <div class="history-actions">
                    <button class="btn-clear-history hidden" id="btn-clear-history" type="button"
                        title="Vymazat celou historii">
                        Vymazat vše
                    </button>
                    <button class="btn-close-drawer" id="btn-close-drawer" type="button"
                        aria-label="Zavřít panel historie">
                        &times;
                    </button>
                </div>
            </div>

            <div class="history-list" id="history-list">
                <!-- Položky historie vložené přes JavaScript -->
            </div>
        </aside>
    </div>

    <!-- Lokální knihovny pro klientský převod souborů -->
    <script src="libs/pdf.min.js"></script>
    <script src="libs/jspdf.umd.min.js"></script>
    <script src="libs/jszip.min.js"></script>
    <script src="libs/xlsx.full.min.js"></script>
    <script src="libs/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
